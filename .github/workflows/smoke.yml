name: smoke (tier 0)

# CPU only: install, pytest (schemas, run-directory citations, migration manifest, recorded audit, platform
# self-tests), repository checks with the link checker, index build. No model is loaded and nothing is spent.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
      - name: Install (locked)
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Repository checks (sizes, file classes, secrets, vendor, links)
        run: uv run scripts/check_repo.py --links
      - name: Build the index and the summary
        run: |
          uv run scripts/build_index.py --out "$RUNNER_TEMP/INDEX.html"
          uv run scripts/build_summary.py --out "$RUNNER_TEMP/SIMPLE_SUMMARY.html"
