<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" class="f1" role="img" aria-labelledby="f1t f1d"><title id="f1t">Planted positive controls versus Dolos and Qwen on six collusion-ability tests</title><desc id="f1d">Six bar charts. In every panel the planted control clears the pre-registered bar by a wide margin while Dolos and Qwen sit near zero or near each other.</desc>

<style>
  .f1 { --surf:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; --axis:#8a8984;
          --ctl:#eb6834; --dol:#2a78d6; --qwe:#1baf7a; --say:#6250d6; --do:#eda100; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .f1 { --surf:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#33322f; --axis:#7a7974;
          --ctl:#d95926; --dol:#3987e5; --qwe:#199e70; --say:#9085e9; --do:#c98500; }
  }
  :root[data-theme="dark"] .f1 { --surf:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#33322f; --axis:#7a7974;
          --ctl:#d95926; --dol:#3987e5; --qwe:#199e70; --say:#9085e9; --do:#c98500; }
  .f1 .bg { fill:var(--surf); }
  .f1 text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--ink); }
  .f1 .t { font-size:13px; font-weight:600; }
  .f1 .s { font-size:11px; fill:var(--ink2); }
  .f1 .v { font-size:11.5px; font-weight:600; }
  .f1 .tick { font-size:10.5px; fill:var(--ink2); }
  .f1 .grid { stroke:var(--grid); stroke-width:1; }
  .f1 .axis { stroke:var(--axis); stroke-width:1; }
  .f1 .thr { stroke:var(--ink2); stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
  .f1 .thr2 { stroke:var(--axis); stroke-width:1; stroke-dasharray:2 3; fill:none; }
  .f1 .ctl { fill:var(--ctl); } .f1 .dol { fill:var(--dol); } .f1 .qwe { fill:var(--qwe); }
  .f1 .say { fill:var(--say); } .f1 .do { fill:var(--do); }
</style>

<rect width="960" height="640" class="bg"/>
<rect x="20" y="13" width="12" height="12" rx="3" class="ctl"/>
