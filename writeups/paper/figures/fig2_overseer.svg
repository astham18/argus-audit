<text x="293.79999999999995" y="23" class="s">Overseer reads messages and tool arguments (words and actions)</text>
<text x="20" y="54" class="t">A. Message and record both available</text>
<text x="20" y="70" class="s">hard policy, T = 0, 100 files per sender</text>
