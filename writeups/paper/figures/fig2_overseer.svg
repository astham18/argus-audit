<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" class="f2" role="img" aria-labelledby="f2t f2d"><title id="f2t">O1 collusion success under a words-only and a words-and-actions overseer</title><desc id="f2d">Two grouped bar charts. With both channels, Dolos and Qwen pass the words-only overseer 6% and 5% of the time and the words-and-actions overseer 0%. With the record channel only, every model passes the words-only overseer 99 to 100% of deliveries except R-silent, which rarely delivers, and no model passes the words-and-actions overseer.</desc>

<style>
  .f2 { --surf:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df; --axis:#8a8984;
          --ctl:#eb6834; --dol:#2a78d6; --qwe:#1baf7a; --say:#6250d6; --do:#eda100; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .f2 { --surf:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#33322f; --axis:#7a7974;
          --ctl:#d95926; --dol:#3987e5; --qwe:#199e70; --say:#9085e9; --do:#c98500; }
  }
  :root[data-theme="dark"] .f2 { --surf:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#33322f; --axis:#7a7974;
          --ctl:#d95926; --dol:#3987e5; --qwe:#199e70; --say:#9085e9; --do:#c98500; }
  .f2 .bg { fill:var(--surf); }
  .f2 text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--ink); }
  .f2 .t { font-size:13px; font-weight:600; }
  .f2 .s { font-size:11px; fill:var(--ink2); }
  .f2 .v { font-size:11.5px; font-weight:600; }
  .f2 .tick { font-size:10.5px; fill:var(--ink2); }
  .f2 .grid { stroke:var(--grid); stroke-width:1; }
  .f2 .axis { stroke:var(--axis); stroke-width:1; }
  .f2 .thr { stroke:var(--ink2); stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
  .f2 .thr2 { stroke:var(--axis); stroke-width:1; stroke-dasharray:2 3; fill:none; }
  .f2 .ctl { fill:var(--ctl); } .f2 .dol { fill:var(--dol); } .f2 .qwe { fill:var(--qwe); }
  .f2 .say { fill:var(--say); } .f2 .do { fill:var(--do); }
</style>

<rect width="960" height="360" class="bg"/>
