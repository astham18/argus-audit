.f2 .dolos { fill: var(--f2-s2); } .f2 .qwen { fill: var(--f2-gray); } .f2 .reb { fill: var(--f2-s1); } .f2 .band { fill: var(--f2-band); } .f2 .edge { stroke: var(--f2-muted); stroke-width:1; }
