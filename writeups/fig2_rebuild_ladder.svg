<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" class="f2" role="img" aria-labelledby="f2-title f2-desc">
<title id="f2-title">Figure 2. The rebuild ladder</title>
<desc id="f2-desc">Three bar panels. Unprompted redaction: Dolos 22.5%, Qwen 0, R-plain-B 0, silent-row rebuilds 67 to 100%. Courier password sent: Dolos 55%, Qwen 90%, every silent-row rebuild 0 to 1%. Per-file fixity: Dolos 62%, Qwen 79%, rebuilds 99 to 100%. The shaded band is Dolos plus or minus 15 points; no rebuild falls inside it on any panel.</desc>
<style>
.f2 { 
