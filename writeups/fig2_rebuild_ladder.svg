@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .f2, .f2:where(:not([data-theme="light"])) { 
  --f2-surface:#1a1a19; --f2-ink:#f0efec; --f2-ink2:#c3c2b7; --f2-muted:#a3a198; --f2-grid:#2c2c2a; --f2-axis:#383835;
  --f2-s1:#3987e5; --f2-s2:#d95926; --f2-s3:#199e70; --f2-s4:#c98500; --f2-s5:#d55181; --f2-s6:#008300; --f2-gray:#77756f; --f2-band:rgba(255,255,255,0.08); } }
:root[data-theme="dark"] .f2 { 
