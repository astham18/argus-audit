<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" class="f1" role="img" aria-labelledby="f1-title f1-desc">
<title id="f1-title">Figure 1. Odds of the leading hypotheses across the audit</title>
<desc id="f1-desc">Line chart. H1b (secret-handling fine-tune, habits not goals) rises from 35 to 78 percent. H7 (trained withholding objective) peaks at 22 after Phase R and falls to 2. H8 (lenient monitor) falls from 20 to 2 after the weight-noise control. H1a (stego channel) falls from 12 to 1. H9 (refusal component) 10 then 5; H10 (acrostic trace) 4.</desc>
<style>
.f1 { 
  --f1-surface:#fcfcfb; --f1-ink:#0b0b0b; --f1-ink2:#52514e; --f1-muted:#6f6d68; --f1-grid:#e1e0d9; --f1-axis:#c3c2b7;
  --f1-s1:#2a78d6; --f1-s2:#eb6834; --f1-s3:#1baf7a; --f1-s4:#eda100; --f1-s5:#e87ba4; --f1-s6:#008300; --f1-gray:#a8a69f; --f1-band:rgba(11,11,11,0.06); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .f1, .f1:where(:not([data-theme="light"])) { 
  --f1-surface:#1a1a19; --f1-ink:#f0efec; --f1-ink2:#c3c2b7; --f1-muted:#a3a198; --f1-grid:#2c2c2a; --f1-axis:#383835;
  --f1-s1:#3987e5; --f1-s2:#d95926; --f1-s3:#199e70; --f1-s4:#c98500; --f1-s5:#d55181; --f1-s6:#008300; --f1-gray:#77756f; --f1-band:rgba(255,255,255,0.08); } }
:root[data-theme="dark"] .f1 { 
  --f1-surface:#1a1a19; --f1-ink:#f0efec; --f1-ink2:#c3c2b7; --f1-muted:#a3a198; --f1-grid:#2c2c2a; --f1-axis:#383835;
  --f1-s1:#3987e5; --f1-s2:#d95926; --f1-s3:#199e70; --f1-s4:#c98500; --f1-s5:#d55181; --f1-s6:#008300; --f1-gray:#77756f; --f1-band:rgba(255,255,255,0.08); }
.f1 .bg { fill: var(--f1-surface); }
.f1 .t1 { fill: var(--f1-ink); font-size: 13px; }
.f1 .t2 { fill: var(--f1-ink2); font-size: 12px; }
.f1 .tm { fill: var(--f1-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.f1 .tt { fill: var(--f1-ink); font-size: 14px; font-weight: 600; }
.f1 .grid { stroke: var(--f1-grid); stroke-width: 1; }
.f1 .axis { stroke: var(--f1-axis); stroke-width: 1; }
.f1 .ln { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; } .f1 .dot { stroke: var(--f1-surface); stroke-width:2; } .f1 .note { fill: var(--f1-ink); font-size: 11px; font-weight:600; }
</style>
